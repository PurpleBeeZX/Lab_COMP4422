<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background-color: #000000;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
            #hud {
                position: fixed;
                top: 8px;
                left: 8px;
                margin: 0;
                color: #dddddd;
                font-family: monospace;
                font-size: 14px;
                pointer-events: none;
                white-space: nowrap;
                z-index: 1;
            }
            #steering {
                position: fixed;
                left: 50%;
                bottom: 18px;
                display: none;
                transform: translateX(-50%);
                text-align: center;
                color: #dddddd;
                font-family: monospace;
                font-size: 12px;
                pointer-events: none;
                z-index: 1;
            }
            #steering-wheel {
                position: relative;
                width: 64px;
                height: 64px;
                margin: 0 auto 4px;
                border: 6px solid #dddddd;
                border-radius: 50%;
                box-sizing: border-box;
                transition: transform 60ms linear;
            }
            #steering-wheel .spoke {
                position: absolute;
                background: #dddddd;
            }
            #steering-wheel .spoke-left,
            #steering-wheel .spoke-right {
                top: 50%;
                width: 50%;
                height: 4px;
                transform: translateY(-50%);
            }
            #steering-wheel .spoke-left {
                left: 0;
            }
            #steering-wheel .spoke-right {
                right: 0;
            }
            #steering-wheel .spoke-bottom {
                left: 50%;
                bottom: 0;
                width: 4px;
                height: 50%;
                transform: translateX(-50%);
            }
            #steering-wheel .hub {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 14px;
                height: 14px;
                background: #dddddd;
                border-radius: 50%;
                transform: translate(-50%, -50%);
            }
        </style>
    </head>
    <body>
        <div id="hud">Loading assets...</div>
        <div id="steering">
            <div id="steering-wheel">
                <span class="spoke spoke-left"></span>
                <span class="spoke spoke-right"></span>
                <span class="spoke spoke-bottom"></span>
                <span class="hub"></span>
            </div>
            <div id="steering-value">C 0%</div>
        </div>
        <canvas id="c"></canvas>
        <script src="Vec3.js"></script>
        <script src="Vec4.js"></script>
        <script src="Mat4.js"></script>
        <script src="objLoader.js"></script>
        <script>
            canvas = document.getElementById("c");
            gl = canvas.getContext("webgl2");
        </script>
        <script src="shader.js"> </script>
        <script src="main.js"></script>
    </body>
</html>
