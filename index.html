<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background-color: #000000;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
            #hud {
                position: fixed;
                top: 8px;
                left: 8px;
                margin: 0;
                color: #dddddd;
                font-family: monospace;
                font-size: 14px;
                pointer-events: none;
                white-space: nowrap;
                z-index: 1;
            }
            #steering {
                position: fixed;
                left: 50%;
                bottom: 18px;
                display: none;
                transform: translateX(-50%);
                text-align: center;
                color: #dddddd;
                font-family: monospace;
                font-size: 12px;
                pointer-events: none;
                z-index: 1;
            }
            #steering-controls {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 18px;
            }
            #steering-wheel {
                position: relative;
                width: 64px;
                height: 64px;
                margin-bottom: 4px;
                border: 6px solid #ff4fd8;
                border-radius: 50%;
                box-sizing: border-box;
                box-shadow: 0 0 10px rgba(255, 79, 216, 0.7);
                transition: transform 60ms linear;
            }
            #steering-wheel .spoke {
                position: absolute;
                background: #dddddd;
            }
            #steering-wheel .spoke-left,
            #steering-wheel .spoke-right {
                top: 50%;
                width: 50%;
                height: 4px;
                transform: translateY(-50%);
            }
            #steering-wheel .spoke-left {
                left: 0;
            }
            #steering-wheel .spoke-right {
                right: 0;
            }
            #steering-wheel .spoke-bottom {
                left: 50%;
                bottom: 0;
                width: 4px;
                height: 50%;
                transform: translateX(-50%);
            }
            #steering-wheel .hub {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 14px;
                height: 14px;
                background: #31e6ff;
                border-radius: 50%;
                transform: translate(-50%, -50%);
            }
            #speedometer {
                text-align: center;
                color: #31e6ff;
            }
            #speed-dial {
                position: relative;
                width: 64px;
                height: 64px;
                margin-bottom: 4px;
                border: 6px solid #ff4fd8;
                border-radius: 50%;
                box-sizing: border-box;
                background: conic-gradient(from 210deg, #ff4fd8 0deg, #8b5cff 160deg, #31e6ff 240deg, rgba(31, 8, 32, 0.9) 240deg 360deg);
                box-shadow: 0 0 10px rgba(255, 79, 216, 0.55);
            }
            #speed-dial::after {
                content: "";
                position: absolute;
                inset: 9px;
                border-radius: 50%;
                background: #160a24;
            }
            #speed-needle {
                position: absolute;
                z-index: 1;
                left: 50%;
                bottom: 50%;
                width: 3px;
                height: 23px;
                background: #31e6ff;
                transform-origin: 50% 100%;
                transform: translateX(-50%) rotate(-120deg);
                transition: transform 60ms linear;
            }
            #speed-value {
                font-size: 11px;
                white-space: nowrap;
                text-shadow: 0 0 6px rgba(49, 230, 255, 0.8);
            }
            #start-screen {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: flex-end;
                justify-content: flex-start;
                padding: 0 0 20px 20px;
                background: rgba(0, 0, 0, 0.12);
                color: #eeeeee;
                font-family: monospace;
                z-index: 2;
            }
            #start-screen.hidden {
                display: none;
            }
            #start-panel {
                width: 420px;
                max-width: calc(100vw - 40px);
                box-sizing: border-box;
                padding: 20px 24px;
                border: 1px solid #ff4fd8;
                background: linear-gradient(135deg, rgba(28, 8, 48, 0.88), rgba(12, 6, 28, 0.82));
                box-shadow: 0 0 24px rgba(255, 79, 216, 0.35);
                text-align: left;
            }
            #start-title {
                margin: 0 0 8px;
                color: #ff77e1;
                font-size: 24px;
                letter-spacing: 3px;
                text-shadow: 0 0 10px rgba(255, 79, 216, 0.8);
            }
            #start-message {
                margin: 0 0 12px;
                color: #b9f6ff;
                font-size: 13px;
                line-height: 1.5;
            }
            .stats {
                margin: 10px 0;
                color: #eeeeee;
                font-size: 13px;
                line-height: 1.5;
                text-align: left;
            }
            .stats-title {
                margin-bottom: 2px;
                color: #ff77e1;
            }
            #start-button {
                margin-top: 10px;
                padding: 8px 22px;
                border: 1px solid #31e6ff;
                background: rgba(49, 230, 255, 0.08);
                color: #31e6ff;
                font-family: monospace;
                font-size: 16px;
                cursor: pointer;
                box-shadow: 0 0 10px rgba(49, 230, 255, 0.4);
            }
            #start-button:hover {
                background: #31e6ff;
                color: #160a24;
            }
        </style>
    </head>
    <body>
        <div id="hud">Loading assets...</div>
        <div id="steering">
            <div id="steering-controls">
                <div id="steering-wheel">
                    <span class="spoke spoke-left"></span>
                    <span class="spoke spoke-right"></span>
                    <span class="spoke spoke-bottom"></span>
                    <span class="hub"></span>
                </div>
                <div id="speedometer">
                    <div id="speed-dial">
                        <div id="speed-needle"></div>
                    </div>
                    <div id="speed-value">0.0 / 6.0</div>
                </div>
            </div>
            <div id="steering-value">C 0%</div>
        </div>
        <div id="start-screen">
            <div id="start-panel">
                <h1 id="start-title">TRAIN RUN</h1>
                <p id="start-message">Press SPACE to start. Collect coins to add carriages. Hitting a cone ends the run.</p>
                <div class="stats" id="last-stats"></div>
                <div class="stats" id="best-stats"></div>
                <button id="start-button">START</button>
            </div>
        </div>
        <canvas id="c"></canvas>
        <script src="Vec3.js"></script>
        <script src="Vec4.js"></script>
        <script src="Mat4.js"></script>
        <script src="objLoader.js"></script>
        <script>
            canvas = document.getElementById("c");
            gl = canvas.getContext("webgl2");
        </script>
        <script src="shader.js"> </script>
        <script src="main.js"></script>
    </body>
</html>
